PAGES.history = {
  render(){
    const f=S.filters.history;
    const vid = f.vesselId || (S.vessels[0]&&S.vessels[0].vesselId);
    const v = vesselBy(vid)||S.vessels[0];
    if(!v) return pageHead('history')+emptyState('No vessels on record','ship');
    const all=S.locations[v.vesselId]||[];
    const range=parseInt(f.range,10)||60;
    const hist=all.slice(-range);
    const bounds=hist.length>3?(()=>{
      const lo=hist.map(h=>h.c[0]),la=hist.map(h=>h.c[1]);
      const px=(Math.max.apply(null,lo)-Math.min.apply(null,lo))*0.2+0.003, py=(Math.max.apply(null,la)-Math.min.apply(null,la))*0.2+0.003;
      return [Math.min.apply(null,lo)-px,Math.min.apply(null,la)-py,Math.max.apply(null,lo)+px,Math.max.apply(null,la)+py];
    })():[THEATRE.w,THEATRE.s,THEATRE.e,THEATRE.n];
    const alts=all.filter(h=>h.st==='APPROACHING'||h.st==='INTRUSION').length;
    const maxSpd=Math.max(1,...hist.map(h=>h.s));
    const spdSeries=hist.map(h=>h.s);
    const selector=`<div class="filterbar">
      <select class="select" data-filter="history" data-k="vesselId" style="min-width:230px">
        ${S.vessels.map(x=>`<option value="${x.vesselId}" ${x.vesselId===v.vesselId?'selected':''}>${x.vesselId} — ${x.name} (${x.vesselType})</option>`).join('')}</select>
      <select class="select" data-filter="history" data-k="range">
        ${[20,60,120,240,420].map(n=>`<option value="${n}" ${range===n?'selected':''}>Last ${n} fixes</option>`).join('')}</select>
      <div class="grow"></div>
      <button class="btn btn-sm" data-act="hist-export" data-id="${esc(v.vesselId)}">${ic('download')}Export track CSV</button>
    </div>`;
    const speedProfile = `<div class="legend mb8"><span><i style="background:#22d3ee"></i>Speed over ground (kn)</span></div>
      ${lineChart(hist.map(h=>tShort(h.t)),[{name:'Speed',color:'#22d3ee',values:spdSeries}],{h:150})}`;
    return pageHead('history',
      `<button class="btn" data-act="go" data-route="vessel" data-id="${esc(v.vesselId)}">${ic('ship')}Vessel dossier</button>
       <button class="btn btn-pri" data-act="hist-export" data-id="${esc(v.vesselId)}">${ic('download')}Export track</button>`,
      'Forensic track reconstruction with breadcrumb playback. Every retained fix carries position, speed over ground, course and evaluated zone status.')
    + `<div class="grid g-split mb16">
      ${card('Track Playback','nav',
        `<div style="height:430px;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden" id="playPlot">
          ${tacticalPlot({w:900,h:430,bounds:bounds,vessels:[Object.assign({},v,{coordinates:hist.length?hist[hist.length-1].c:v.coordinates,status:hist.length?hist[hist.length-1].st:v.status,direction:hist.length?hist[hist.length-1].d:v.direction})],zones:S.zones,showInactive:true,scale:1.6})}
        </div>
        <div class="mt12">
          <input type="range" id="playRange" min="0" max="${Math.max(0,hist.length-1)}" value="${Math.max(0,hist.length-1)}" style="width:100%;accent-color:#10b981">
          <div class="flex jb ac mt8 wrap" style="gap:10px">
            <div class="mono dim" style="font-size:10px" id="playInfo">FIX ${hist.length} / ${hist.length}</div>
            <div class="flex gap6">
              <button class="btn btn-sm" data-act="play-start" data-id="${esc(v.vesselId)}">${ic('chevLeft')}Start</button>
              <button class="btn btn-sm btn-pri" data-act="play-run" data-id="${esc(v.vesselId)}">${ic('play')}Play</button>
              <button class="btn btn-sm" data-act="play-end" data-id="${esc(v.vesselId)}">End${ic('chevRight')}</button>
            </div>
          </div>
        </div>`, null, false)}
      <div class="grid" style="gap:14px;align-content:start">
        ${card('Track Summary','chart',
          `<div class="kv"><span class="k">Vessel</span><span class="v">${esc(v.vesselId)} — ${esc(v.name)}</span></div>
           <div class="kv"><span class="k">Fixes retained</span><span class="v mono">${all.length}</span></div>
           <div class="kv"><span class="k">Window</span><span class="v mono">${hist.length?tShort(hist[0].t)+' \u2192 '+tShort(hist[hist.length-1].t):'—'}</span></div>
           <div class="kv"><span class="k">Approach / intrusion fixes</span><span class="v mono" style="color:${alts?'var(--am)':'var(--tx)'}">${alts}</span></div>
           <div class="kv"><span class="k">Peak SOG</span><span class="v mono">${maxSpd.toFixed(1)} kn</span></div>
           <div class="kv"><span class="k">Mean SOG</span><span class="v mono">${hist.length?(hist.reduce((a,h)=>a+h.s,0)/hist.length).toFixed(1):'0.0'} kn</span></div>
           <div class="kv"><span class="k">Track length</span><span class="v mono">${trackLength(hist).toFixed(2)} km</span></div>`,null,false)}
        ${card('Speed Profile','activity', speedProfile, null, false)}
        ${card('Position Log','list',
          `<div style="max-height:280px;overflow-y:auto"><table class="tbl" style="min-width:0"><thead><tr>
             <th>Time</th><th class="r">Lat</th><th class="r">Lng</th><th class="r">Kn</th><th>Status</th></tr></thead>
           <tbody>${hist.slice().reverse().slice(0,40).map(h=>`<tr>
             <td class="mono" style="font-size:10.5px">${tTime(h.t)}</td>
             <td class="r mono" style="font-size:10.5px">${h.c[1].toFixed(4)}</td>
             <td class="r mono" style="font-size:10.5px">${h.c[0].toFixed(4)}</td>
             <td class="r mono" style="font-size:10.5px">${h.s.toFixed(1)}</td>
             <td>${statusBadge(h.st)}</td></tr>`).join('')}</tbody></table></div>`, null, true)}
      </div>
    </div>
    <div class="mt16">${card('Playback Source','history', selector, null, true)}</div>`;
  },
  mount(){
    const r=document.getElementById('playRange');
    if(!r) return;
    r.addEventListener('input',()=>{
      const f=S.filters.history;
      const v=vesselBy(f.vesselId)||S.vessels[0];
      const hist=(S.locations[v.vesselId]||[]).slice(-(parseInt(f.range,10)||60));
      const i=clamp(parseInt(r.value,10),0,hist.length-1);
      const fx=hist[i]; if(!fx) return;
      const plot=document.getElementById('playPlot');
      if(plot) plot.innerHTML=tacticalPlot({w:900,h:430,bounds:trackBounds(hist),scale:1.6,
        vessels:[Object.assign({},v,{coordinates:fx.c,status:fx.st,direction:fx.d})],zones:S.zones,showInactive:true});
      const info=document.getElementById('playInfo');
      if(info) info.textContent=`FIX ${i+1} / ${hist.length} · ${tFull(fx.t)} · ${fx.c[1].toFixed(5)}N ${fx.c[0].toFixed(5)}E · ${fx.s.toFixed(1)} kn @ ${fx.d.toFixed(0)}\u00B0`;
    });
  }
};
function trackBounds(hist){
  if(hist.length<4) return [THEATRE.w,THEATRE.s,THEATRE.e,THEATRE.n];
  const lo=hist.map(h=>h.c[0]),la=hist.map(h=>h.c[1]);
  const px=(Math.max.apply(null,lo)-Math.min.apply(null,lo))*0.2+0.003, py=(Math.max.apply(null,la)-Math.min.apply(null,la))*0.2+0.003;
  return [Math.min.apply(null,lo)-px,Math.min.apply(null,la)-py,Math.max.apply(null,lo)+px,Math.max.apply(null,la)+py];
}
function trackLength(hist){
  let d=0; for(let i=1;i<hist.length;i++) d+=haversine(hist[i-1].c,hist[i].c);
  return d/1000;
}

function field(label,id,value,opts){
  opts=opts||{};
  const key=opts.key||id;
  const attr=`id="${id}" data-f="${key}" ${opts.type?`type="${opts.type}"`:''} ${opts.min!=null?`min="${opts.min}"`:''} ${opts.max!=null?`max="${opts.max}"`:''} ${opts.step!=null?`step="${opts.step}"`:''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}`;
  if(opts.options){
    return `<div class="field"><label for="${id}">${esc(label)}${opts.req?' *':''}</label>
      <select class="select" id="${id}" data-f="${key}">${opts.options.map(o=>{
        const val=typeof o==='object'?o.v:o, lab=typeof o==='object'?o.l:titleCase(o);
        return `<option value="${esc(val)}" ${String(value)===String(val)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select>
      ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</div>`;
  }
  return `<div class="field"><label for="${id}">${esc(label)}${opts.req?' *':''}</label>
    <input class="input" ${attr} value="${esc(value==null?'':value)}">
    ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</div>`;
}
/* Collects every [data-f] control into a flat object, coercing numeric inputs. */
function readForm(root){
  const o={};
  root.querySelectorAll('[data-f]').forEach(el=>{
    const k=el.getAttribute('data-f');
    o[k] = el.type==='number' ? parseFloat(el.value) : el.value;
  });
  return o;
}
function markBad(root,id){
  const el=root.querySelector('#'+id);
  if(el){ el.classList.add('bad'); el.addEventListener('input',()=>el.classList.remove('bad'),{once:true}); el.addEventListener('change',()=>el.classList.remove('bad'),{once:true}); }
  return false;
}

        if(isNew){

      <span class="mono dim" style="font-size:10.5px">${esc(z.zoneId)}</span></div>
    <div class="grid2">
      ${`<div class="field"><label for="zId">Zone ID *</label><input class="input" id="zId" data-f="zoneId" value="${esc(z.zoneId)}" ${isNew?'':'readonly'}></div>`}
      ${field('Zone name','zName',z.name,{key:'name',req:true,placeholder:'e.g. South Kanyakumari Defence Sector'})}
      ${field('Zone classification','zType',z.zoneType,{key:'zoneType',options:ZONE_TYPES.map(t=>({v:t,l:ZONE_TYPE_META[t].label}))})}
      ${field('Severity','zSev',z.severity,{key:'severity',options:SEVERITIES})}
      ${field('Warning buffer (metres)','zBuf',z.warningDistance,{key:'warningDistance',type:'number',min:100,max:10000,step:50,

      ${field('Zone state','zStatus',z.status,{key:'status',options:['ACTIVE','INACTIVE']})}
    </div>
    <div class="field"><label for="zDesc">Description</label>
      <textarea class="textarea" id="zDesc" data-f="description" placeholder="Legal basis, restrictions, standing orders…">${esc(z.description||'')}</textarea></div>
    <div class="field"><label>Polygon vertices (longitude / latitude, GeoJSON order)</label>
      <div id="vlist">${vertRows()}</div>
      <div class="flex gap6 mt8">

      <div style="height:230px;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden" id="zonePreview"></div></div>
    <div id="formErr"></div>`;
  const preview=()=>{
    const box=document.getElementById('zonePreview'); if(!box) return;
    const vv=collectVerts();
    if(vv.length<3){ box.innerHTML=`<div class="empty" style="padding:60px 0">${ic('fence')}<div class="m">ADD AT LEAST 3 VERTICES</div></div>`; return; }
    const ring=vv.concat([vv[0]]);
    const lo=vv.map(p=>p[0]),la=vv.map(p=>p[1]);
    const px=(Math.max.apply(null,lo)-Math.min.apply(null,lo))*0.35+0.004, py=(Math.max.apply(null,la)-Math.min.apply(null,la))*0.35+0.004;
    box.innerHTML=tacticalPlot({w:700,h:230,pad:16,
      bounds:[Math.min.apply(null,lo)-px,Math.min.apply(null,la)-py,Math.max.apply(null,lo)+px,Math.max.apply(null,la)+py],
      zones:[{zoneId:'PREVIEW',zoneType:document.getElementById('zType')?document.getElementById('zType').value:'MONITORING',
        severity:'HIGH',status:'ACTIVE',warningDistance:parseFloat((document.getElementById('zBuf')||{}).value)||1000,
        geometry:{type:'Polygon',coordinates:[ring]}}],
      vessels:S.vessels.filter(v=>v.coordinates[0]>Math.min.apply(null,lo)-px&&v.coordinates[0]<Math.max.apply(null,lo)+px&&
             v.coordinates[1]>Math.min.apply(null,la)-py&&v.coordinates[1]<Math.max.apply(null,la)+py),
      scale:0.85});
  };
  const collectVerts=()=>{
    const out=[];
    document.querySelectorAll('#vlist [data-vrow]').forEach(r=>{
      const lng=parseFloat(r.querySelector('[data-v="lng"]').value), lat=parseFloat(r.querySelector('[data-v="lat"]').value);
      if(!isNaN(lng)&&!isNaN(lat)) out.push([lng,lat]);
    });
    return out;
  };
  openModal({
    title:isNew?'Define geofence zone':'Edit geofence zone', icon:'fence', size:'wide', body,
    footer:`<button class="btn" data-act="modal-close">Cancel</button>
            <button class="btn btn-pri" id="zSave">${ic('check')}${isNew?'Create zone':'Save geometry'}</button>`,
    onMount(root){
      preview();
      root.addEventListener('click',e=>{
        const b=e.target.closest('[data-act]'); if(!b) return;
        const a=b.getAttribute('data-act');
        if(a==='zone-vadd'){
          const list=root.querySelector('#vlist');
          const n=list.querySelectorAll('[data-vrow]').length;
          const last=list.querySelector('[data-vrow]:last-child');
          const lng=last?parseFloat(last.querySelector('[data-v="lng"]').value)+0.004:77.53;
          const lat=last?parseFloat(last.querySelector('[data-v="lat"]').value):8.06;
          list.insertAdjacentHTML('beforeend',`<div class="flex gap6 ac mb8" data-vrow>
            <span class="mono dim" style="font-size:10px;width:22px">${String(n+1).padStart(2,'0')}</span>
            <input class="input" data-v="lng" value="${lng.toFixed(4)}" style="flex:1">
            <input class="input" data-v="lat" value="${lat.toFixed(4)}" style="flex:1">
            <button class="btn btn-icon btn-xs" data-act="zone-vdel">${ic('x')}</button></div>`);
          preview();
        }
        if(a==='zone-vdel'){
          if(root.querySelectorAll('[data-vrow]').length<=3){ toast('am','Minimum 3 vertices','A polygon ring requires at least three distinct vertices.'); return; }
          b.closest('[data-vrow]').remove(); preview();
        }
        if(a==='zone-vreset'){ closeModal(); zoneFormModal(id); }
      });
      root.addEventListener('input',e=>{ if(e.target.closest('#vlist')||e.target.id==='zBuf'||e.target.id==='zType') preview(); });
      root.querySelector('#zSave').onclick=()=>{
        const d=readForm(root);
        const errs=[];
        if(!String(d.name||'').trim()) errs.push(['zName','Zone name is required.']);
        if(!(d.warningDistance>=100)) errs.push(['zBuf','Warning buffer must be at least 100 m.']);
        const vv=collectVerts();
        if(vv.length<3) errs.push(['vlist','At least three valid vertices are required.']);
        if(errs.length){
          errs.forEach(e=>markBad(root,e[0]));
          root.querySelector('#formErr').innerHTML=`<div class="err">${ic('alert',null,12)}${esc(errs.map(e=>e[1]).join(' '))}</div>`;
          return;
        }
        const rec={ zoneId:d.zoneId, name:String(d.name).trim(), zoneType:d.zoneType, severity:d.severity,
          warningDistance:d.warningDistance, status:d.status, description:d.description,
          geometry:{type:'Polygon',coordinates:[vv.concat([vv[0]])]} };
        if(isNew){
          S.zones.push(rec);
          audit('ZONE','CREATE',`${rec.zoneId} "${rec.name}" defined (${rec.zoneType}/${rec.severity}, buffer ${rec.warningDistance} m).`,'vi');
          pushFeed('zone',`Geofence defined — ${rec.zoneId}`,rec.name+' is now under active evaluation.','vi');
          toast('vi','Zone created',`${rec.zoneId} — ${rec.name} is now active.`);

          const i=S.zones.findIndex(x=>x.zoneId===id);
          S.zones[i]=rec;
          audit('ZONE','UPDATE',`${rec.zoneId} geometry or parameters amended.`,'cy');
          toast('cy','Zone updated',`${rec.zoneId} — ${rec.name} saved.`);
        }
        closeModal(); rebuildMap(); render();
      };
    }
  });
}

/* ================================================================ AUTH ==== */
function makeToken(u){
  const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,'');
  const now=Math.floor(Date.now()/1000);
  return b64({alg:'HS256',typ:'JWT'})+'.'+b64({sub:u.id,email:u.email,role:u.role,name:u.name,iat:now,exp:now+28800})
    +'.'+btoa('cidrtm-sim-'+u.id).replace(/=+$/,'');
}
function signIn(email,password){
  const u=S.users.find(x=>x.email.toLowerCase()===String(email).trim().toLowerCase());
  if(!u) return 'No account found for that service email.';
  if(u.password!==password) return 'Passphrase rejected. Verify the credentials and try again.';
  if(u.status!=='ACTIVE') return 'This account is suspended. Contact the system administrator.';
  const now=nowMs();
  u.lastLogin=now;
  S.auth={user:u, token:makeToken(u), issuedAt:now, exp:now+28800000};
  try{ sessionStorage.setItem('cidrtm.session',JSON.stringify({email:u.email,token:S.auth.token,issuedAt:now,exp:S.auth.exp})); }catch(e){}
  return null;
}

    if(!em||!pw){ renderLogin('Both the service email and passphrase are required.'); return; }
    const err=signIn(em,pw);
    if(err){ renderLogin(err); return; }
    startApp();
  });
  document.querySelectorAll('[data-demo]').forEach(b=>{
    b.addEventListener('click',()=>{
      const [em,pw]=b.getAttribute('data-demo').split('|');
      document.getElementById('lgEmail').value=em;
      document.getElementById('lgPass').value=pw;
      document.getElementById('lgPass').focus();
    });
  });
}

function refreshLiveRegions(){
  const r=S.route;
  if(r==='monitoring'){
    refreshMapMarkers();
    const sb=document.getElementById('streamBox');
    if(sb) sb.innerHTML=S.stream.slice(0,60).map(l=>
      `<div class="ln"><span class="ts">${tTime(l.at)}</span><span class="ms ${l.tone}">${esc(l.msg)}</span></div>`).join('');
    const tb=document.getElementById('telBox');
    if(tb) tb.innerHTML=telemetryHTML();
    const bn=document.getElementById('alertBanner');
    if(bn) bn.innerHTML=alertBannerHTML();
    const st=document.getElementById('simStage');
    if(st) st.textContent=S.sim.stage||'IDLE — SELECT A SCENARIO';
    const pg=document.getElementById('simProg');
    if(pg) pg.style.width=(scenarioProgress()*100).toFixed(1)+'%';
    const tc=document.getElementById('simElapsed');
    if(tc) tc.textContent='T+'+S.sim.elapsed+'s';
  }
  if(r==='dashboard'){
    const fl=document.getElementById('feedList');
    if(fl) fl.innerHTML=S.feed.slice(0,12).map(feedItemHTML).join('')||emptyState('No activity yet','radio');
  }
  S.ui.liveTick=(S.ui.liveTick||0)+1;
  if(S.ui.liveTick%8===0 && ['vessels','alerts','incidents','zones','history','analytics'].indexOf(r)>=0){
    const ae=document.activeElement;
    if(!(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))){
      const sc=document.getElementById('view').scrollTop;
      render();
      document.getElementById('view').scrollTop=sc;
    }
  }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){
    if(e.target.classList.contains('overlay')){
      if(e.target.id==='modalOverlay') closeModal();
      if(e.target.id==='alertPop') closeAlertPop();
    }
    if(S.ui.dropdown && !e.target.closest('[data-act="user-menu"]')){ S.ui.dropdown=null; renderTopbar(); }
    return;
  }
  const act=t.getAttribute('data-act');
  if(ACT[act]){ e.preventDefault(); ACT[act](t,e); }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-filter]');
  if(el){
    const cfg=el.getAttribute('data-filter'), k=el.getAttribute('data-k');
    let v=el.value;
    if(k==='per'||k==='range'||k==='page') v=parseInt(v,10);
    S.filters[cfg][k]=v; S.filters[cfg].page=1;
    render(); return;
  }
  const pf=e.target.closest('[data-pref]');
  if(pf){
    const k=pf.getAttribute('data-pref');
    S.prefs[k] = pf.type==='checkbox' ? pf.checked : (pf.type==='number'? parseFloat(pf.value) : pf.value);
    audit('PREF','UPDATE',`Preference "${k}" set to ${S.prefs[k]}.`,'sl');
    if(k==='tiles'){
      if(MAP.inst&&MAP.tiles){
        const tc=tileConfig();
        MAP.tiles.setUrl(tc.url);
        if(MAP.tiles.options) MAP.tiles.options.attribution=tc.attribution;
        applyTileTheme();
      }
      toast('cy','Basemap changed','Tile provider updated.');
    }
    if(k==='dedupWindow') toast('cy','Dedup window updated',`Suppression window set to ${S.prefs[k]}s.`);
    render();
  }
});
document.addEventListener('input',debounce(e=>{
  const el=e.target.closest('[data-filter]');
  if(!el) return;
  const cfg=el.getAttribute('data-filter'), k=el.getAttribute('data-k');
  if(el.tagName!=='INPUT') return;
  S.filters[cfg][k]=el.value; S.filters[cfg].page=1;
  const focus=document.activeElement, pos=focus&&focus.selectionStart;
  render();
  const nf=document.querySelector(`[data-filter="${cfg}"][data-k="${k}"]`);
  if(nf){ nf.focus(); try{ nf.setSelectionRange(pos,pos); }catch(err){} }
},320));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('alertPop')){ closeAlertPop(); return; }
    if(document.getElementById('modalOverlay')){ closeModal(); return; }
    if(document.getElementById('drawer')){ closeDrawer(); return; }
    if(S.ui.dropdown){ S.ui.dropdown=null; renderTopbar(); return; }
  }
  if(e.key==='/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName)){
    const s=document.querySelector('main.view input[data-k="q"]');
    if(s){ e.preventDefault(); s.focus(); }
  }
});

function signOut(){
  if(S.sim.timer) clearInterval(S.sim.timer);
  if(S.ui.playing) clearInterval(S.ui.playing);
  audit('SYSTEM','LOGOUT',`${S.auth?S.auth.user.name:'Operator'} signed out of the CSOC console.`,'sl');
  try{ sessionStorage.removeItem('cidrtm.session'); }catch(e){}
  S.auth=null; S.sim.running=false;
  document.getElementById('app').hidden=true;
  document.getElementById('login').hidden=false;
  closeModal(); closeDrawer(); closeAlertPop();
  renderLogin();
}

function startApp(){
  document.getElementById('login').hidden=true;
  document.getElementById('app').hidden=false;
  audit('SYSTEM','LOGIN',`${S.auth.user.name} authenticated (${ROLE_META[S.auth.user.role].label}). Session valid 8 h.`,'em');
  logStream(`Operator ${S.auth.user.name} authenticated. Role ${S.auth.user.role}.`,'em');
  pushFeed('system',`${S.auth.user.name} signed in`,`${ROLE_META[S.auth.user.role].label} — session opened.`,'cy');
  S.route='dashboard';
  render();
  toast('em','Console online','CIDRTM watch floor ready. Select a scenario under Live Security Monitoring.');
}

function boot(){
  initData();
  let restored=false;
  try{
    const raw=sessionStorage.getItem('cidrtm.session');
    if(raw){
      const s=JSON.parse(raw);
      if(s.exp>nowMs()){
        const u=S.users.find(x=>x.email===s.email);
        if(u && u.status==='ACTIVE'){ S.auth={user:u,token:s.token,issuedAt:s.issuedAt,exp:s.exp}; restored=true; }
      } else sessionStorage.removeItem('cidrtm.session');
    }
  }catch(e){}
  if(restored) startApp(); else renderLogin();

  setInterval(()=>{ const t=document.getElementById('clockT'); if(t) t.textContent=tTime(nowMs()); },1000);
  setTimeout(()=>{ if(S.route==='monitoring') ensureMap(); },200);
}

bus.on('intrusion',p=>{
  SND.critical();
  criticalPopup(p);
  toast('cr','INTRUSION — '+p.vessel.vesselId,
    p.vessel.name+' entered '+p.zone.name+'. Alert '+p.alert.alertId+', incident '+p.incident.incidentId+' raised.',10000);
  updateLive();
});
bus.on('approach',p=>{
  // Approaches are logged to the activity feed and the event stream, and carry
  // a soft audible cue — but deliberately do not raise a toast. A swarm scenario
  // would otherwise blanket the operator rail with notifications.
  SND.warn();
});
bus.on('tick',()=>{ updateLive(); });
bus.on('stage',s=>{ toast(s.tone||'cy',s.label,'Demonstration pipeline advanced.'); });

boot();






</script>
